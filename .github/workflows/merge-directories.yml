name: Cross-check public laundry directories
on:
  push:
    paths:
      - scripts/merge_directories.py
      - .github/workflows/merge-directories.yml
  workflow_dispatch:
  schedule:
    - cron: "15 6 * * 5"
permissions:
  contents: write
concurrency:
  group: cross-directory-census
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "requests>=2.31,<3" "beautifulsoup4>=4.12,<5"
      - name: Collect permitted city directories and conservative matching
        run: python scripts/merge_directories.py
      - name: Verify source integrity and no false verified flags
        run: node tests/directories.mjs
      - name: Commit independent source-count evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/annuaire-croise.json data/annuaire-croise-audit.json
          if ! git diff --cached --quiet; then
            git commit -m "data: cross-compare OSM BAUG and Laverie Ouvert public directories"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
