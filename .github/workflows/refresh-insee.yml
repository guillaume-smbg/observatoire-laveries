name: Refresh official INSEE IRIS data independently
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/refresh-insee.yml
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: insee-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "shapely>=2.0,<3"
      - name: Download and join genuine IRIS data
        run: python -c "from scripts.refresh_data import collect_demography; print('Published',collect_demography(),'matched IRIS zones')"
      - name: Save source-dated data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/iris-2022.json data/iris-2022-contours.geojson
          if ! git diff --cached --quiet; then
            git commit -m "data: update official INSEE 2022 IRIS evidence [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
