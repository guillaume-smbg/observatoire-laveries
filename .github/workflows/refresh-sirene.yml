name: Refresh official SIRENE candidates
on:
  workflow_dispatch:
  schedule:
    - cron: "25 4 * * 4"
  push:
    paths:
      - scripts/refresh_sirene.py
      - .github/workflows/refresh-sirene.yml
permissions:
  contents: write
concurrency:
  group: sirene-census
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh public SIRENE candidates and proximity audit
        run: python scripts/refresh_sirene.py
      - name: Require complete four-department public snapshot
        run: node tests/data-integrity.mjs
      - name: Commit evidence snapshot and trigger site redeployment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sirene-laundries.json data/sirene-audit.json data/candidats-sirene-sans-osm.csv
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh administrative SIRENE candidates"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

