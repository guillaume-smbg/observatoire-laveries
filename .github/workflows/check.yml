name: Validate observatory
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/smoke.mjs
      - run: node tests/data-integrity.mjs
      - run: node tests/directories.mjs
      - run: node tests/census-static.mjs
      - run: python3 -m py_compile scripts/refresh_data.py scripts/refresh_geofabrik.py scripts/refresh_sirene.py scripts/merge_directories.py
