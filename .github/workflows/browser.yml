name: Browser smoke test
on:
  workflow_dispatch:
  pull_request:
    paths:
      - index.html
      - observatoire.js
      - analytics.js
      - advanced-finance.js
      - recensement.html
      - recensement.js
      - opportunites.html
      - opportunites.js
      - tests/**
      - .github/workflows/browser.yml
  workflow_run:
    workflows:
      - Generate opportunity areas
    types: [completed]
  push:
    paths:
      - tests/browser.mjs
      - tests/opportunities-browser.mjs
      - opportunites.js
      - opportunites.html
      - recensement.html
      - recensement.js
      - tests/census-browser.mjs
      - .github/workflows/browser.yml
permissions:
  contents: read
jobs:
  chromium:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Start local static web server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/observatoire-http.log 2>&1 &
          sleep 2
      - run: node tests/browser.mjs
      - run: node tests/opportunities-browser.mjs
      - run: node tests/census-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: observatoire-smoke
          path: |
            /tmp/observatoire-smoke.png
            /tmp/observatoire-opportunites.png
            /tmp/observatoire-recensement.png
          if-no-files-found: ignore
