name: Refresh official INSEE IRIS statistics
on:
  workflow_dispatch:
  schedule:
    - cron: "32 4 * * 1"
  push:
    paths:
      - scripts/refresh_data.py
      - .github/workflows/refresh-data.yml
permissions:
  contents: write
concurrency:
  group: insee-refresh
  cancel-in-progress: false
jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install geometry helper
        run: python -m pip install "shapely>=2.0,<3"
      - name: Refresh public datasets
        run: python scripts/refresh_data.py
      - name: Commit successful public data or refresh diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh official INSEE and OSM sources"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
