name: Refresh public INSEE and OSM datasets
on:
  workflow_dispatch:
  schedule:
    - cron: "32 4 * * 1"
  push:
    paths:
      - scripts/refresh_data.py
      - .github/workflows/refresh-data.yml
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: observatoire-refresh
  cancel-in-progress: true
jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install geometry helper
        run: python -m pip install "shapely>=2.0,<3"
      - name: Refresh public datasets
        run: python scripts/refresh_data.py
      - name: Commit successful public data or refresh diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh official INSEE and OSM sources [skip ci]"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
