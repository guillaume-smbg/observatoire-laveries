name: Refresh four-department OSM inventory (Geofabrik)
on:
  workflow_dispatch:
  schedule:
    - cron: "10 4 * * 2"
  push:
    paths:
      - scripts/refresh_geofabrik.py
      - .github/workflows/refresh-geofabrik.yml
permissions:
  contents: write
concurrency:
  group: geofabrik-osm-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install local PBF processor and geometry library
        run: python -m pip install "osmium>=4,<5" "shapely>=2,<3"
      - name: Extract actual OSM-mapped laundries by four departments
        run: python scripts/refresh_geofabrik.py
      - name: Commit audited data snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/laveries-osm.json data/osm-extract-status.json data/osm-audit.json
          if ! git diff --cached --quiet; then
            git commit -m "data: update four-department Geofabrik OSM snapshot"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
