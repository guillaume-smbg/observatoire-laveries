name: Deploy static site to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows:
      - Refresh four-department OSM inventory (Geofabrik)
      - Refresh official SIRENE candidates
      - Refresh official INSEE IRIS statistics
      - Generate opportunity areas
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4